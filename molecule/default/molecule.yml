---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: plausible-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        plausible_debug_service_enabled: false

        # The same image the role installs, started again with none of the
        # configuration the role renders, to establish what Plausible does on
        # its own before anything below is credited to the role.
        plausible_molecule_standalone_identifier: plausible-molecule-default-standalone

        # The account the verification seeds and then logs in as over HTTP.
        # Plausible has no way to create the first user from the outside: its
        # registration form is a LiveView that creates the account over a
        # WebSocket and only afterwards posts to /login to open the session, so
        # the account is seeded through Plausible's own Auth API instead and the
        # login that follows is what exercises the real HTTP surface.
        plausible_molecule_user_name: Molecule Tester
        plausible_molecule_user_email: molecule@example.com
        plausible_molecule_user_password: plausible-molecule-user-password

        # The site that the pageview below is sent for. Plausible drops events
        # for domains it does not know, so this has to exist before ingestion.
        plausible_molecule_site_domain: molecule.example.com
        plausible_molecule_event_pathname: /molecule-probe
        plausible_molecule_event_referrer: https://duckduckgo.com/

        # A globally routable address, so that the pageview is attributed to a
        # country. Plausible resolves that through the `location_data_dict`
        # dictionary it keeps in ClickHouse, which is the very thing
        # `plausible_clickhouse_dictionaries_restamp_enabled` exists to keep
        # working - a country in the stored event proves the dictionary answers.
        plausible_molecule_event_ip: 8.8.8.8

        # Variables for Plausible Analytics
        plausible_uid: 1000
        plausible_gid: 1000
        plausible_scheme: http
        plausible_hostname: localhost
        plausible_container_labels_traefik_enabled: false
        plausible_container_http_host_bind_port: 8000
        plausible_environment_variable_base_url: http://localhost:8000/
        plausible_environment_variable_secret_key_base: EcKiF4JQpRBzfwQ8goJBWU+40CtIc6SY/d5xrM0m4l6XzR3apgzZLG0BbPfH3v2v

        # Variables required for Plausible Analytics to connect to the Postgres database
        plausible_database_hostname: "{{ postgres_connection_hostname }}"
        plausible_database_port: "{{ postgres_connection_port }}"
        plausible_database_username: my_database_username
        plausible_database_password: my_database_password
        plausible_database_name: plausible
        plausible_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables required for Plausible Analytics to connect to the ClickHouse database
        plausible_clickhouse_database_hostname: "{{ clickhouse_identifier }}"
        plausible_clickhouse_database_password: password

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        # Spelled out (it repeats the role default) so that the verify play, where
        # the Postgres role's defaults are not in scope, can address the container.
        postgres_identifier: postgres
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ plausible_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': plausible_database_name,
              'username': plausible_database_username,
              'password': plausible_database_password,
            }]
          }}

        # Variables for ClickHouse
        clickhouse_uid: 1000
        clickhouse_gid: 1000
        # Spelled out (it repeats the role default) so that the verify play, where
        # the ClickHouse role's defaults are not in scope, can address the container.
        clickhouse_identifier: clickhouse
        clickhouse_root_password: password
        clickhouse_container_network: "{{ plausible_container_network }}"
        clickhouse_managed_databases: |
          {{
            [{
              'name': plausible_clickhouse_database_name,
              'username': plausible_clickhouse_database_username,
              'password': plausible_clickhouse_database_password,
              'additional_sql': ('GRANT SELECT ON system.replicas TO ' + plausible_clickhouse_database_username + '; GRANT SELECT ON system.parts TO ' + plausible_clickhouse_database_username + '; GRANT CREATE FUNCTION ON *.* TO ' + plausible_clickhouse_database_username + '; GRANT DROP FUNCTION ON *.* TO ' + plausible_clickhouse_database_username + ';')
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
